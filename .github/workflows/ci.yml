name: CI

on:
  workflow_dispatch:

jobs:
  rust:
    name: Rust 코어 빌드 및 테스트
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust 캐시
        uses: Swatinem/rust-cache@v2

      - name: 포맷 검사
        run: cargo fmt --all -- --check

      - name: Lint 검사 (dbx-core)
        run: cargo clippy -p dbx-core -- -D warnings

      - name: 빌드 (dbx-core)
        run: cargo build -p dbx-core --locked

      - name: 테스트 (dbx-core)
        run: cargo test -p dbx-core --locked

      - name: 빌드 (dbx-ffi)
        run: cargo build -p dbx-ffi --locked

      - name: 빌드 (dbx-csharp)
        run: cargo build -p dbx-csharp --locked

      - name: 빌드 (dbx-node)
        run: cargo build -p dbx-node --locked

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 빌드 (dbx-py)
        run: cargo build -p dbx-py --locked
