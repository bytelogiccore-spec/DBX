name: CI

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

jobs:
  check:
    name: 포맷 & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: mold 링커 설치
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mold clang

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust 캐시
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 포맷 검사
        run: cargo fmt --all -- --check

      - name: Lint 검사 (dbx-core, dbx-tests)
        run: cargo clippy -p dbx-core -p dbx-tests --no-deps -- -D warnings

  test-rust:
    name: Rust 테스트 (nextest)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: mold 링커 설치
        run: sudo apt-get update && sudo apt-get install -y mold clang

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable

      - name: cargo-nextest 설치
        uses: taiki-e/install-action@nextest

      - name: Rust 캐시
        uses: Swatinem/rust-cache@v2

      - name: 유닛 & 통합 테스트 실행
        run: cargo nextest run -p dbx-core -p dbx-tests --locked

  build-bindings:
    name: 바인딩 빌드 (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        package: [dbx-ffi, dbx-csharp, dbx-node, dbx-py]
    steps:
      - uses: actions/checkout@v4

      - name: mold 링커 설치
        run: sudo apt-get update && sudo apt-get install -y mold clang

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 캐시
        uses: Swatinem/rust-cache@v2

      - name: Node.js 설치 (dbx-node 전용)
        if: matrix.package == 'dbx-node'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Python 설치 (dbx-py 전용)
        if: matrix.package == 'dbx-py'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 빌드 실행
        run: cargo build -p ${{ matrix.package }} --locked
