name: CI

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

jobs:
  check:
    name: 포맷 & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: mold 링커 설치
        run: sudo apt-get update && sudo apt-get install -y mold clang

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust 캐시
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 포맷 검사
        run: cargo fmt --all -- --check

      - name: Lint 검사 (dbx-core)
        run: cargo clippy -p dbx-core -- -D warnings

  build-and-test:
    name: 빌드 & 테스트
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: mold 링커 설치
        run: sudo apt-get update && sudo apt-get install -y mold clang

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 캐시
        uses: Swatinem/rust-cache@v2

      - name: 빌드 & 테스트 (dbx-core)
        run: |
          cargo build -p dbx-core --locked
          cargo test -p dbx-core --locked

      - name: 빌드 (dbx-ffi, dbx-csharp)
        run: |
          cargo build -p dbx-ffi --locked
          cargo build -p dbx-csharp --locked

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 빌드 (dbx-node)
        run: cargo build -p dbx-node --locked

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 빌드 (dbx-py)
        run: cargo build -p dbx-py --locked
