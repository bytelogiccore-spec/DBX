name: Publish → crates.io

on:
  workflow_dispatch:
  workflow_call:

jobs:
  publish:
    name: crates.io 배포
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: mold 링커 설치
        run: sudo apt-get update && sudo apt-get install -y mold clang

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish dbx-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo publish -p dbx-core --no-verify

      - name: Publish dbx-ffi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo publish -p dbx-ffi --no-verify

