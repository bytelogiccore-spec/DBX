[package]
name = "dbx-benchmarks"
version = "0.1.2-beta"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Benchmarks for DBX database engine"

[dependencies]
dbx-core = { path = "../dbx-core" }
criterion = { version = "0.5", features = ["html_reports"] }
arrow = "54"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sled = "0.34"
redb = "2.1"
sqlparser = "0.52"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "storage_bench"
harness = false

[[bench]]
name = "sql_insert_benchmark"
harness = false

[[bench]]
name = "sql_update_delete_benchmark"
harness = false

[[bench]]
name = "sql_vs_kv"
harness = false

[[bench]]
name = "parallel_engine_bench"
harness = false

[[bench]]
name = "sql_baseline"
harness = false

[[bench]]
name = "ddl_api_benchmark"
harness = false

[[bench]]
name = "phase1_benchmarks"
harness = false

[[bench]]
name = "phase1_improved_benchmarks"
harness = false

[[bench]]
name = "parallel_parser_optimized"
harness = false

[[bench]]
name = "phase2_benchmarks"
harness = false

[[bench]]
name = "phase2_comparison"
harness = false

[[bench]]
name = "cleanup_bench"
harness = false

[[bench]]
name = "official_db_comparison"
harness = false

[[bench]]
name = "dbx_baseline"
harness = false

[[bench]]
name = "wos_flush_comparison"
harness = false

[[bench]]
